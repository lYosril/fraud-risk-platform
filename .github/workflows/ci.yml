name: CI

# NOTE: this workflow has not been executed yet. It is scaffolding for milestone M9;
# it is only trustworthy once it has run green on a real commit (docs/ROADMAP.md, M9).

# `on` is quoted because YAML 1.1 parsers (including PyYAML) coerce the bare key to the
# boolean `true`; GitHub's parser accepts either, but quoting keeps local linters honest.
"on":
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI deterministic about the supported interpreter.
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests
        run: pytest -q

      # An integration job with a PostgreSQL service container and
      # `pytest -m integration` is added in milestone M2, once those tests exist.
      # Adding it now would produce a permanently red job that collects zero tests.
